plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Fabric API etc. resolve from Fabric maven (declared in settings for the
    // plugin; add here for mod dependencies)
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    // Minecraft + loader
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // MAPPINGS DECISION (see PORT-AUDIT.md SS10): Mojang official mappings,
    // NOT yarn -- the Forge codebase being ported is 100% Mojmap, and keeping
    // the same names makes the port diff reviewable class-for-class.
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API (networking, lifecycle events, screen handlers land here in
    // Phase 2+; needed from the start for item-group/tab plumbing)
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}
